name: update-ipcidr

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ipcidr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create target directory
        run: mkdir -p ipcidr

      - name: Fetch and process China IP lists
        run: |
          curl -s -o bgp-ipv4.list "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china.txt"
          curl -s -o bgp-ipv6.list "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt"
          curl -s "https://ftp.apnic.net/apnic/stats/apnic/delegated-apnic-latest" > apnic.txt
          
          cat apnic.txt | grep ipv4 | grep CN | awk -F\| '{ printf("%s/%d\n", $4, 32-log($5)/log(2)) }' > apnic-ipv4.list
          cat apnic.txt | grep "|CN|ipv6|" | cut -d"|" -f"4,5" | tr "|" "/" > apnic-ipv6.list
          rm apnic.txt

          sed -i "s/[[:space:]]//g" *.list
          
          python3 -c '
          import ipaddress, sys
          def merge_cidrs(input_files, output_file):
              nets = []
              for fname in input_files:
                  with open(fname) as f:
                      for line in f:
                          line = line.strip()
                          if line:
                              try:
                                  nets.append(ipaddress.ip_network(line, strict=False))
                              except ValueError:
                                  pass
              collapsed = sorted(ipaddress.collapse_addresses(nets))
              with open(output_file, "w") as f:
                  f.write("\n".join(str(n) for n in collapsed) + "\n")

          merge_cidrs(["apnic-ipv4.list", "bgp-ipv4.list"], "ipcidr/china-ipv4.cidr")
          merge_cidrs(["apnic-ipv6.list", "bgp-ipv6.list"], "ipcidr/china-ipv6.cidr")
          '
          rm *.list

      - name: Fetch and process Telegram IP lists
        run: |
          curl -s https://core.telegram.org/resources/cidr.txt > telegram_raw.txt
          python3 -c '
          import ipaddress
          with open("telegram_raw.txt") as f:
              lines = [line.strip() for line in f if line.strip() and not line.startswith("#")]

          # 补充官方 cidr.txt 未包含的 Telegram 网段 Sub-allocated range 95.161.64.0/20
          extra_v4 = ["95.161.64.0/20"]
          lines.extend(extra_v4)
          
          v4_nets = [ipaddress.ip_network(l, strict=False) for l in lines if "." in l]
          v6_nets = [ipaddress.ip_network(l, strict=False) for l in lines if ":" in l]

          with open("ipcidr/telegram-ipv4.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v4_nets))) + "\n")
          with open("ipcidr/telegram-ipv6.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v6_nets))) + "\n")
          '
          rm telegram_raw.txt

      - name: Fetch and process AWS IP lists
        run: |
          curl -s https://ip-ranges.amazonaws.com/ip-ranges.json > ip-ranges.json
          python3 -c '
          import json, ipaddress
          with open("ip-ranges.json") as f:
              data = json.load(f)

          amzn_china_v4, amzn_non_china_v4 = [], []
          amzn_china_v6, amzn_non_china_v6 = [], []

          for p in data.get("prefixes", []):
              net = ipaddress.ip_network(p["ip_prefix"], strict=False)
              if p.get("region", "").startswith("cn"):
                  amzn_china_v4.append(net)
              else:
                  amzn_non_china_v4.append(net)

          for p in data.get("ipv6_prefixes", []):
              net = ipaddress.ip_network(p["ipv6_prefix"], strict=False)
              if p.get("region", "").startswith("cn"):
                  amzn_china_v6.append(net)
              else:
                  amzn_non_china_v6.append(net)

          def write_cidr(nets, path):
              with open(path, "w") as f:
                  f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(nets))) + "\n")

          write_cidr(amzn_china_v4, "ipcidr/amazon-china-ipv4.cidr")
          write_cidr(amzn_non_china_v4, "ipcidr/amazon-!china-ipv4.cidr")
          write_cidr(amzn_china_v6, "ipcidr/amazon-china-ipv6.cidr")
          write_cidr(amzn_non_china_v6, "ipcidr/amazon-!china-ipv6.cidr")
          '
          rm ip-ranges.json

      - name: Fetch and process Google IP lists (goog.json)
        run: |
          curl -s https://www.gstatic.com/ipranges/goog.json > goog.json
          python3 -c '
          import json, ipaddress
          with open("goog.json") as f:
              data = json.load(f)

          v4, v6 = [], []
          for p in data.get("prefixes", []):
              if "ipv4Prefix" in p:
                  v4.append(ipaddress.ip_network(p["ipv4Prefix"], strict=False))
              if "ipv6Prefix" in p:
                  v6.append(ipaddress.ip_network(p["ipv6Prefix"], strict=False))

          with open("ipcidr/google-ipv4.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v4))) + "\n")
          with open("ipcidr/google-ipv6.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v6))) + "\n")
          '
          rm goog.json

      - name: Fetch and process Google Cloud IP lists (cloud.json)
        run: |
          curl -s https://www.gstatic.com/ipranges/cloud.json > cloud.json
          python3 -c '
          import json, ipaddress
          with open("cloud.json") as f:
              data = json.load(f)

          v4, v6 = [], []
          for p in data.get("prefixes", []):
              if "ipv4Prefix" in p:
                  v4.append(ipaddress.ip_network(p["ipv4Prefix"], strict=False))
              if "ipv6Prefix" in p:
                  v6.append(ipaddress.ip_network(p["ipv6Prefix"], strict=False))

          with open("ipcidr/google-cloud-ipv4.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v4))) + "\n")
          with open("ipcidr/google-cloud-ipv6.cidr", "w") as f:
              f.write("\n".join(str(n) for n in sorted(ipaddress.collapse_addresses(v6))) + "\n")
          '
          rm cloud.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ipcidr/
          
          if git diff --quiet --staged; then
            echo "No changes detected, skipping commit."
            exit 0
          fi
          
          git commit -m "Update IP CIDR lists (Fix Google IPv6 extraction): $(date --rfc-3339=sec)"
          git push
