name: update-rule-set

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/filter/domain/gto-proxy-domain.list'
      - 'qx/filter/ip/gto-home-ip.list'
  workflow_run:
    workflows:
      - "update-ipcidr"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-rule-set:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Setup sing-box
      env:
        SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.11.7/sing-box_1.11.7_linux_amd64.deb"
      run: |
        set -Eeuo pipefail
        wget -O sing-box.deb "$SING_BOX_DEB_URL"
        sudo dpkg -i sing-box.deb

    - name: Run Converter
      run: |
        # 直接通过参数传递：参数1是 rules.txt 路径，参数2是输出目录
        python tools/converter.py "tools/sing-box-geosite" "qx/filter/domain"
        python tools/converter.py "tools/sing-box-geoip" "qx/filter/ip"
        python tools/converter.py "tools/ipcidr" "qx/filter/ip"
        python tools/converter.py "tools/ipcidr" "sing-box"
        python tools/converter.py "tools/qxlist" "sing-box"

    - name: Commit and push changes
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # 记得把生成的 .list, .json 和 .srs 都加入 git 追踪
        git add qx/filter/domain/*.list
        git add qx/filter/ip/*.list
        git add sing-box/*.json
        git add sing-box/*.srs

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Auto-update rules: synchronize list, json & srs"
          git pull --rebase
          git push origin main
        fi
