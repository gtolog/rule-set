name: update-rule-set

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/filter/domain/gto-proxy.list'
      - 'qx/filter/domain/gto-local.list'
      - 'qx/filter/ip/gto-home.list'
  workflow_run:
    workflows:
      - "update-ipcidr"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-rule-set:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 1. 缓存 Python Pip 依赖
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    # 2. 缓存 sing-box 二进制文件
    - name: Cache sing-box binary
      id: cache-sing-box
      uses: actions/cache@v4
      with:
        path: bin/sing-box
        key: ${{ runner.os }}-sing-box-v1.11.7

    - name: Setup sing-box
      if: steps.cache-sing-box.outputs.cache-hit != 'true'
      run: |
        set -Eeuo pipefail
        mkdir -p bin
        VERSION="1.11.7"
        wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        mv sing-box-${VERSION}-linux-amd64/sing-box bin/
        rm -rf sing-box*

    - name: Add sing-box to PATH
      run: echo "$PWD/bin" >> $GITHUB_PATH

    # 3. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Converter (QX & sing-box)
      run: |
        python tools/converter.py "tools/ipcidr" "qx/filter/ip" --target qx-ip
        python tools/converter.py "tools/sing-box-geosite" "qx/filter/domain" --target qx-domain
        python tools/converter.py "tools/xray-geosite" "qx/filter/domain" --target qx-domain
        python tools/converter.py "tools/gfwlist" "qx/filter/domain" --target qx-domain --name gfwlist
        
        python tools/converter.py "tools/ipcidr" "sing-box/ip" --target singbox-ip
        python tools/converter.py "tools/qx-filter-ip" "sing-box/ip" --target singbox-ip
        python tools/converter.py "tools/qx-filter-domain" "sing-box/domain" --target singbox-domain
        python tools/converter.py "tools/xray-geosite" "sing-box/domain" --target singbox-domain
        python tools/converter.py "tools/gfwlist" "sing-box/domain" --target singbox-domain --name gfwlist

    - name: Run Xray Converter and Build Dat
      run: |
        mkdir -p xray/ip xray/domain

        # 直接读取你的配置清单文件进行批量转换
        python tools/converter.py "tools/ipcidr" "xray/ip" --target xray-ip
        python tools/converter.py "tools/qx-filter-ip" "xray/ip" --target xray-ip
        python tools/converter.py "tools/qx-filter-domain" "xray/domain" --target xray-domain
        python tools/converter.py "tools/sing-box-geosite" "xray/domain" --target xray-domain
        python tools/converter.py "tools/gfwlist" "xray/domain" --target xray-domain --name gfwlist

        # --- 编译 domain-list-community ---
        go install github.com/v2fly/domain-list-community@latest
        $(go env GOPATH)/bin/domain-list-community --datapath=./xray/domain --outputname=geosite.dat --outputdir=./xray

        # --- 编译 v2fly/geoip ---
        go install github.com/v2fly/geoip@latest
        
        cat << EOF > geoip-config.json
        {
          "input": [
            {
              "type": "text",
              "action": "add",
              "args": {
                "inputDir": "./xray/ip"
              }
            }
          ],
          "output": [
            {
              "type": "v2rayGeoIPDat",
              "action": "output",
              "args": {
                "outputDir": "./xray",
                "outputName": "geoip.dat"
              }
            }
          ]
        }
        EOF
        
        $(go env GOPATH)/bin/geoip -c geoip-config.json

    - name: Download and Repackage Xray ARM64-v8a into xray/
      run: |
        mkdir -p xray_extracted
        
        echo "Fetching latest Xray-core release URL for arm64-v8a..."
        DOWNLOAD_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep "browser_download_url" \
            | grep -E 'Xray-linux-arm64-v8a\.zip"' \
            | cut -d '"' -f 4 \
            | head -n 1)
            
        if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to get Xray download URL."
            exit 1
        fi
        
        echo "Downloading from: $DOWNLOAD_URL"
        wget -O xray.zip "$DOWNLOAD_URL"
        
        echo "Extracting zip..."
        unzip -q xray.zip -d xray_extracted
        
        echo "Repackaging to .tar.gz inside xray/ directory..."
        # 直接输出到 ./xray/Xray-linux-arm64-v8a.tar.gz
        tar -czf xray/Xray-linux-arm64-v8a.tar.gz -C xray_extracted .
        
        # 清理临时文件（保留转换出来的 geosite.dat、geoip.dat 和刚打好的 tar.gz）
        rm -rf xray.zip xray_extracted
        echo "Xray binary successfully placed in xray/ !"

    - name: Prepare Release Artifacts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 1. 直接尝试将远程 release 分支克隆到 release_stage 目录中
        # 这样能完美保留 release 分支上已有的所有内容（如 ipcidr 等）
        git clone --branch release --single-branch https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git release_stage || echo "Release branch does not exist yet or clone failed, starting fresh."
        
        # 如果 release 分支尚不存在，确保 release_stage 目录存在
        mkdir -p release_stage
        
        # 2. 将本次最新生成的 qx、sing-box、xray 目录覆盖/合并到发布暂存区
        # （原有的 ipcidr 目录会安全地保留在 release_stage/ipcidr 中，不会被删除）
        for dir in qx sing-box xray; do
          if [ -d "$dir" ]; then
            rm -rf "release_stage/$dir"
            cp -r "$dir" release_stage/
          fi
        done

    - name: Deploy to release branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GH_PAT }}
        publish_dir: ./release_stage
        publish_branch: release
        commit_message: "Auto-update rules and xray binary package: $(date --rfc-3339=sec)"
        force_orphan: false
        disable_nojekyll: true
