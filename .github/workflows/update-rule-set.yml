name: update-rule-set

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/filter/domain/gto-proxy-domain.list'
      - 'qx/filter/ip/gto-home-ip.list'
  workflow_run:
    workflows:
      - "update-ipcidr"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-rule-set:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 1. 缓存 Python Pip 依赖
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    # 2. 缓存 sing-box 二进制文件
    - name: Cache sing-box binary
      id: cache-sing-box
      uses: actions/cache@v4
      with:
        path: bin/sing-box
        key: ${{ runner.os }}-sing-box-v1.11.7

    - name: Setup sing-box
      if: steps.cache-sing-box.outputs.cache-hit != 'true'
      run: |
        set -Eeuo pipefail
        mkdir -p bin
        VERSION="1.11.7"
        wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        mv sing-box-${VERSION}-linux-amd64/sing-box bin/
        rm -rf sing-box*

    - name: Add sing-box to PATH
      run: echo "$PWD/bin" >> $GITHUB_PATH

    # 3. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Converter (QX & sing-box)
      run: |
        python tools/converter.py "tools/sing-box-geosite" "qx/filter/domain" --target qx
        python tools/converter.py "tools/ipcidr" "qx/filter/ip" --target qx
        python tools/converter.py "tools/ipcidr" "sing-box" --target singbox
        python tools/converter.py "tools/qxlist" "sing-box" --target singbox

    # 4. 生成 Xray 纯文本规则源并编译 dat
    - name: Build Xray Dat Files
      run: |
        mkdir -p xray/ip xray/domain

        find qx/filter/ip -name "*.list" > ip_file_list
        python tools/converter.py ip_file_list "xray/ip" --target xray-ip

        find qx/filter/domain -name "*.list" > domain_file_list
        python tools/converter.py domain_file_list "xray/domain" --target xray-domain

        # 编译 domain-list-community
        go install github.com/v2fly/domain-list-community@latest
        $(go env GOPATH)/bin/domain-list-community --datapath=./xray/domain --outputname=xray.domain.dat --outputdir=./xray

        # 编译 v2fly/geoip
        go install github.com/v2fly/geoip@latest
        
        cat << EOF > geoip-config.json
        {
          "input": [
            {
              "type": "text",
              "action": "add",
              "args": {
                "inputDir": "./xray/ip"
              }
            }
          ],
          "output": [
            {
              "type": "v2rayGeoIPDat",
              "action": "output",
              "args": {
                "outputDir": "./xray",
                "outputName": "xray.ip.dat"
              }
            }
          ]
        }
        EOF
        
        $(go env GOPATH)/bin/geoip -c geoip-config.json

    # 5. 【新增】将生成的所有产物统一打包并同步到 release 分支
    - name: Prepare Release Artifacts
      run: |
        mkdir -p release_stage
        # 将需要的目录复制到临时发布目录中
        cp -r qx release_stage/
        cp -r sing-box release_stage/
        cp -r xray release_stage/

    - name: Deploy to release branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./release_stage
        publish_branch: release
        commit_message: "Auto-update rules: sync QX, sing-box & Xray dat files"
        force_orphan: false
