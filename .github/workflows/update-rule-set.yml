name: update-rule-set

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/filter/domain/gto-proxy-domain.list'
      - 'qx/filter/ip/gto-home-ip.list'
  workflow_run:
    workflows:
      - "update-ipcidr"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-rule-set:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 1. 缓存 Python Pip 依赖
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    # 2. 缓存 sing-box 二进制文件
    - name: Cache sing-box binary
      id: cache-sing-box
      uses: actions/cache@v4
      with:
        path: bin/sing-box
        key: ${{ runner.os }}-sing-box-v1.11.7

    - name: Setup sing-box
      if: steps.cache-sing-box.outputs.cache-hit != 'true'
      run: |
        set -Eeuo pipefail
        mkdir -p bin
        VERSION="1.11.7"
        wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        mv sing-box-${VERSION}-linux-amd64/sing-box bin/
        rm -rf sing-box*

    - name: Add sing-box to PATH
      run: echo "$PWD/bin" >> $GITHUB_PATH

    # 3. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Converter (QX & sing-box)
      run: |
        python tools/converter.py "tools/sing-box-geosite" "qx/filter/domain" --target qx
        python tools/converter.py "tools/ipcidr" "qx/filter/ip" --target qx
        python tools/converter.py "tools/ipcidr" "sing-box" --target singbox
        python tools/converter.py "tools/qxlist" "sing-box" --target singbox

    - name: Run Xray Converter and Build Dat
      run: |
        mkdir -p xray/ip xray/domain

        # 直接读取你的配置清单文件进行批量转换
        python tools/converter.py "tools/ipcidr" "xray/ip" --target xray-ip
        python tools/converter.py "tools/qxlist" "xray/domain" --target xray-domain
        python tools/converter.py "tools/sing-box-geosite" "xray/domain" --target xray-domain

        # --- 编译 domain-list-community ---
        go install github.com/v2fly/domain-list-community@latest
        $(go env GOPATH)/bin/domain-list-community --datapath=./xray/domain --outputname=geosite.dat --outputdir=./xray

        # --- 编译 v2fly/geoip ---
        go install github.com/v2fly/geoip@latest
        
        cat << EOF > geoip-config.json
        {
          "input": [
            {
              "type": "text",
              "action": "add",
              "args": {
                "inputDir": "./xray/ip"
              }
            }
          ],
          "output": [
            {
              "type": "v2rayGeoIPDat",
              "action": "output",
              "args": {
                "outputDir": "./xray",
                "outputName": "geoip.dat"
              }
            }
          ]
        }
        EOF
        
        $(go env GOPATH)/bin/geoip -c geoip-config.json
        
    - name: Prepare Release Artifacts
      run: |
        mkdir -p release_stage
        
        # 1. 配置 Git 身份并安全拉取远程 release 分支到临时目录合并
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 强制把远程 release 分支拉到本地的一个名为 temp_release 的目录中
        git fetch origin release:temp_release || true
        
        if git show-ref --verify --quiet refs/heads/temp_release; then
          echo "Found existing release branch, copying old contents..."
          # 将 release 分支已有的所有文件（包含 ipcidr）复制到发布暂存区
          git worktree add ./wt_release temp_release
          cp -r wt_release/* release_stage/ 2>/dev/null || true
          git worktree remove ./wt_release --force || true
        else
          echo "Release branch does not exist yet, starting fresh."
        fi
        
        # 2. 将本次最新生成的 qx、sing-box、xray 目录覆盖/合并到发布暂存区
        for dir in qx sing-box xray; do
          if [ -d "$dir" ]; then
            rm -rf "release_stage/$dir"
            cp -r "$dir" release_stage/
          fi
        done

    - name: Deploy to release branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./release_stage
        publish_branch: release
        commit_message: "Auto-update rules and dat files: $(date --rfc-3339=sec)"
        force_orphan: false
