name: update-rule-set

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/filter/domain/gto-proxy-domain.list'
      - 'qx/filter/ip/gto-home-ip.list'
  workflow_run:
    workflows:
      - "update-ipcidr"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-rule-set:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 1. 缓存 Python Pip 依赖，避免每次重复下载
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    # 2. 缓存 sing-box 二进制文件（基于版本号）
    - name: Cache sing-box binary
      id: cache-sing-box
      uses: actions/cache@v4
      with:
        path: bin/sing-box
        key: ${{ runner.os }}-sing-box-v1.11.7

    # 3. 如果缓存未命中，则下载轻量级 tar.gz 并解压（免去 dpkg 和 sudo 消耗）
    - name: Setup sing-box
      if: steps.cache-sing-box.outputs.cache-hit != 'true'
      run: |
        set -Eeuo pipefail
        mkdir -p bin
        VERSION="1.11.7"
        wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        mv sing-box-${VERSION}-linux-amd64/sing-box bin/
        rm -rf sing-box*

    - name: Add sing-box to PATH
      run: echo "$PWD/bin" >> $GITHUB_PATH

    - name: Run Converter
      run: |
        python tools/converter.py "tools/sing-box-geosite" "qx/filter/domain"
        python tools/converter.py "tools/ipcidr" "qx/filter/ip"
        python tools/converter.py "tools/ipcidr" "sing-box"
        python tools/converter.py "tools/qxlist" "sing-box"

    - name: Commit and push changes
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        git add qx/filter/domain/*.list
        git add qx/filter/ip/*.list
        git add sing-box/*.json
        git add sing-box/*.srs

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Auto-update rules: synchronize list, json & srs"
          git pull --rebase
          git push origin main
        fi
