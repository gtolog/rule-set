name: update-qx-filter

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *' # 可选：每天定时自动执行

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

env:
  OUTPUT_DIR: "${{ github.workspace }}/qx/filter"

jobs:
  update-qx-filter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Setup sing-box
      env:
        SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.11.7/sing-box_1.11.7_linux_amd64.deb"
      run: |
        set -Eeuo pipefail
        wget -O sing-box.deb "$SING_BOX_DEB_URL"
        sudo dpkg -i sing-box.deb

    - name: Run Converter
      run: |
        mkdir -p "$OUTPUT_DIR"
        python tools/converter.py

    - name: Commit and push changes
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        git add "$FILTER_OUTPUT_DIR"/*.list

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Auto-update rules: synchronize list, json & srs"
          git pull --rebase
          git push origin main
        fi
